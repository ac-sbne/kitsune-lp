<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>kitsune-lp | Contact</title>
    <meta name="description" content="Contact: Gmail宛のお問い合わせ導線ページ。" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="brand" href="./index.html">kitsune-lp</a>
        <nav class="site-nav" aria-label="メインナビゲーション">
          <a href="./index.html">Home</a>
          <a href="./create-item.html">Create Item</a>
          <a href="./information.html">Information</a>
          <a class="active" href="./contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="section hero">
        <div class="container">
          <p class="eyebrow">Contact</p>
          <h1>Gmail宛のお問い合わせ</h1>
          <p class="lead">フォームサービス経由で受信する実用構成です。</p>
        </div>
      </section>

      <section class="section alt">
        <div class="container">
          <div class="form-wrap">
            <form action="https://formspree.io/f/your-form-id" method="POST">
              <label for="name">お名前</label>
              <input id="name" name="name" type="text" required />

              <label for="email">メールアドレス</label>
              <input id="email" name="email" type="email" required />

              <label for="message">お問い合わせ内容</label>
              <textarea id="message" name="message" required></textarea>

              <button class="btn btn-primary" type="submit">送信する</button>
            </form>
            <p class="note">
              お問い合わせで取得した個人情報は、お問い合わせ対応の目的にのみ利用し、目的外利用は行いません。
            </p>
            <p class="note">実運用時は Formspree または Google Form の送信先URLへ差し替えてください。</p>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <h2>最短・無料の代替導線</h2>
          <p>メールアプリ起動のみで良い場合は mailto を利用できます。</p>
          <a class="btn" href="mailto:acsbne.company@gmail.com?subject=Contact%20from%20kitsune-lp">mailtoを開く</a>
        </div>
      </section>
    </main>
  </body>
</html>
